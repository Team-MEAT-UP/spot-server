name: Stg Deploy

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: moisam-server

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          TOSS_MTLS_KEY_STORE: ${{ secrets.TOSS_MTLS_KEY_STORE }}
          TOSS_MTLS_KEY_STORE_PASSWORD: ${{ secrets.TOSS_MTLS_KEY_STORE_PASSWORD }}
        run: ./gradlew clean build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:stg-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE=build/libs/*.jar

      - name: Set image output
        id: set-image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:stg-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          TOSS_MTLS_KEY_STORE: ${{ secrets.TOSS_MTLS_KEY_STORE }}
          TOSS_MTLS_KEY_STORE_PASSWORD: ${{ secrets.TOSS_MTLS_KEY_STORE_PASSWORD }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,TOSS_MTLS_KEY_STORE,TOSS_MTLS_KEY_STORE_PASSWORD
          script: |
            # 1. ECR 로그인
            ECR_URL=$(echo ${{ needs.build.outputs.image }} | cut -d/ -f1)
            aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_URL

            # 2. 기존 컨테이너 중지 및 제거
            sudo docker stop moisam-server-stg || true
            sudo docker rm moisam-server-stg || true

            # 3. 새로운 컨테이너 실행
            sudo docker run -d --name moisam-server-stg \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=stg \
              -e TOSS_MTLS_KEY_STORE="$TOSS_MTLS_KEY_STORE" \
              -e TOSS_MTLS_KEY_STORE_PASSWORD="$TOSS_MTLS_KEY_STORE_PASSWORD" \
              ${{ needs.build.outputs.image }}

            # 4. 컨테이너 상태 및 로그 확인
            sudo docker ps -a
            sudo docker logs moisam-server-stg --tail=100

            # 5. 사용하지 않는 dangling 이미지만 정리
            sudo docker image prune -f
