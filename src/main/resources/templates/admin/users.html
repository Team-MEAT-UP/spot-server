<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MOISAM Admin - 사용자 관리</title>

    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --border-color: #eef2f5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            background-color: var(--bg-color);
        }

        h2 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 24px;
            font-weight: 700;
        }

        /* 통계 컨테이너 */
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid #17a2b8;
            padding: 20px 25px;
            border-radius: 8px;
            min-width: 220px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            flex: 1;
        }

        .stat-card.register {
            border-left-color: #36b9cc;
        }

        .stat-card.login {
            border-left-color: #f6c23e;
        }

        .stat-card .label {
            display: block;
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--text-dark);
        }

        .stat-card .unit {
            font-size: 0.6em;
            margin-left: 4px;
            color: #495057;
            font-weight: 500;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        /* 테이블 스타일 */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #495057;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 14px;
            color: var(--text-dark);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        tr.deleted-row {
            opacity: 0.55;
        }

        tr.deleted-row:hover {
            opacity: 0.75;
        }

        /* 동의/미동의 뱃지 */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
        }

        .badge-agreed {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .badge-not-agreed {
            background-color: #f5f5f5;
            color: #9e9e9e;
        }

        /* 상태 뱃지 */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-active {
            color: #28a745;
            background: #e8f5e9;
        }

        .status-deleted {
            color: #dc3545;
            background: #ffebee;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active .status-dot {
            background-color: #28a745;
            animation: pulse-green 2s infinite;
        }

        .status-deleted .status-dot {
            background-color: #dc3545;
        }

        @keyframes pulse-green {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* 빈 상태 */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            background-color: #fff;
        }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 30px;
            padding-bottom: 40px;
        }

        .pagination a {
            padding: 8px 14px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            color: var(--primary);
            text-decoration: none;
            background-color: #fff;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
            min-width: 14px;
            text-align: center;
        }

        .pagination a.nav-btn {
            color: #6c757d;
            background-color: #f8f9fa;
        }

        .pagination a:hover:not(.active) {
            background-color: #e9ecef;
            border-color: #ced4da;
            color: #0056b3;
        }

        .pagination .active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            cursor: default;
        }
    </style>
</head>
<body>

<div class="admin-wrapper" style="display: flex; min-height: 100vh;">
    <div th:replace="~{admin/fragments/common :: sidebar('users')}"></div>

    <div class="main-content">
        <h2>Users</h2>

        <!-- 통계 -->
        <div class="stats-container" th:if="${dailyUserStats != null}">
            <div class="stat-card register">
                <span class="label">👤 금일 신규 가입자</span>
                <div class="value">
                    <span th:text="${#numbers.formatInteger(dailyUserStats.dailyRegisterUserCount(), 0, 'COMMA')}">0</span>
                    <span class="unit">명</span>
                </div>
            </div>
            <div class="stat-card login">
                <span class="label">🔑 금일 로그인 유저</span>
                <div class="value">
                    <span th:text="${#numbers.formatInteger(dailyUserStats.dailyLoginUserCount(), 0, 'COMMA')}">0</span>
                    <span class="unit">명</span>
                </div>
            </div>
        </div>

        <!-- 테이블 목록 -->
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>사용자 ID</th>
                    <th>닉네임</th>
                    <th>이메일</th>
                    <th>개인정보 동의</th>
                    <th>마케팅 동의</th>
                    <th>가입일</th>
                    <th>상태</th>
                    <th>탈퇴일</th>
                </tr>
                </thead>
                <tbody th:if="${!userPage.content.isEmpty()}">
                <tr th:each="user : ${userPage.content}"
                    th:classappend="${user.deletedDateTime != null ? 'deleted-row' : ''}">
                    <td th:text="${user.userId}"
                        style="font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: #6c757d;">ID
                    </td>
                    <td style="font-weight: 500;" th:text="${user.nickname}">닉네임</td>
                    <td style="font-size: 13px; color: #495057;" th:text="${user.email}">이메일</td>
                    <td>
                        <span class="badge badge-agreed"
                              th:if="${user.isPersonalInfoAgreement}">동의</span>
                        <span class="badge badge-not-agreed"
                              th:unless="${user.isPersonalInfoAgreement}">미동의</span>
                    </td>
                    <td>
                        <span class="badge badge-agreed"
                              th:if="${user.isMarketingAgreement}">동의</span>
                        <span class="badge badge-not-agreed"
                              th:unless="${user.isMarketingAgreement}">미동의</span>
                    </td>
                    <td th:text="${#temporals.format(user.createdDateTime, 'yyyy-MM-dd HH:mm')}"
                        style="font-size: 13px;">2026-01-01 12:00
                    </td>
                    <td>
                        <span th:if="${user.deletedDateTime == null}" class="status-badge status-active">
                            <span class="status-dot"></span>활성
                        </span>
                        <span th:if="${user.deletedDateTime != null}" class="status-badge status-deleted">
                            <span class="status-dot"></span>탈퇴
                        </span>
                    </td>
                    <td style="font-size: 13px; color: #6c757d;"
                        th:text="${user.deletedDateTime != null ? #temporals.format(user.deletedDateTime, 'yyyy-MM-dd HH:mm') : '-'}">
                        -
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${userPage.content.isEmpty()}" class="empty-state">
                <div style="font-size: 24px; margin-bottom: 12px;">📭</div>
                등록된 사용자가 없습니다.
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${userPage.totalPages > 1}">
            <th:block th:with="
                currentPageNumber=${userPage.number},
                blockSize=5,
                startPage=${(currentPageNumber / blockSize) * blockSize},
                endPage=(${(startPage + blockSize - 1) < userPage.totalPages ? (startPage + blockSize - 1) : userPage.totalPages - 1})
            ">
                <a class="nav-btn"
                   th:href="@{/admins/users(page=0)}"
                   th:if="${startPage > 0}" title="처음">&laquo;</a>

                <a class="nav-btn"
                   th:href="@{/admins/users(page=${startPage - 1})}"
                   th:if="${startPage > 0}" title="이전">&lsaquo;</a>

                <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                    <a th:href="@{/admins/users(page=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == userPage.number ? 'active' : ''}">1</a>
                </th:block>

                <a class="nav-btn"
                   th:href="@{/admins/users(page=${endPage + 1})}"
                   th:if="${endPage < userPage.totalPages - 1}" title="다음">&rsaquo;</a>

                <a class="nav-btn"
                   th:href="@{/admins/users(page=${userPage.totalPages - 1})}"
                   th:if="${endPage < userPage.totalPages - 1}" title="끝">&raquo;</a>
            </th:block>
        </div>
    </div>
</div>

</body>
</html>
